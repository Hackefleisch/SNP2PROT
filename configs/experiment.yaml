# Modelling configuration: split regimes, seeds, baseline and metric settings.
#
# THE SECOND CONFIG FILE, and deliberately not part of `thresholds.yaml`
# (docs/ML_PLAN.md section 9.2, decided 2026-08-19). Changing a threshold invalidates the
# dataset, every report and every provenance row; changing a fold count or a seed does not.
# Two things with different blast radii do not belong in one file.
#
# Read it via `snp2prot.experiment`, never by opening the path. Seeds live here rather than
# in code or at a call site, so that a run records the seed it actually used.

version: 1

splits:
  # Regimes S1 and S2 (docs/ML_PLAN.md section 5). The whole protein axis is in play in every
  # regime -- no subsetting -- and only the designated group is ever removed.
  n_folds: 5

  # S2 holds out connected components of the domain graph, with an edge wherever two domains
  # of the same family reach this percent identity over an alignment covering at least
  # cluster.min_overlap of the shorter one.
  #
  # THIS IS AN EVALUATION-TIME GROUPING and it lives here rather than in thresholds.yaml
  # because it changes no stored table: wt_id, mut_positions and the cluster inventory are
  # untouched by it (docs/ML_PLAN.md section 5).
  #
  # 0.5, decided 2026-08-19 (docs/DECISIONS.md). The grouping began at `<= 5 edits`, which is
  # ~94% identity on a 77 aa domain, and the nearest-neighbour baseline measured what that
  # bought: 0.018 AUPR against a random split, because copying a 70-90% identical neighbour
  # already scores 0.927. The split is meant to be hard, so the floor sits well below the
  # 60-70% band Weirauch et al. 2014 set for transferring a motif by identity.
  #
  # It chains -- at 0.5 the largest component is 273 domains with a median internal identity
  # of 0.377 -- and that is the safe direction: over-grouping removes more from training than
  # strictly necessary but can never leak. The cost is statistical power, not validity.
  s2_min_identity: 0.5

  # One seed for every fold assignment and every P3 draw. Recorded with each run; a fold's
  # membership is also hashed into the report, because the seed alone does not pin it if the
  # corpus changes underneath.
  seed: 20260819

  # P1 holds out one whole Pfam family. Homeodomain is 428 of 1,338 domains and carries 84 of
  # the 173 variants -- the only family large enough to be a real test whose removal does not
  # empty the training set (docs/ML_PLAN.md section 6.1).
  p1_family: Homeodomain

  # P3 removes a fraction of the 173 variants from training and tests on the removed ones: a
  # data-efficiency curve whose `all` row is the zero-shot extreme where training holds wild
  # types only. `half` and `quarter` are repeated over seeded draws because which variants get
  # dropped matters at n = 86 and n = 43.
  p3:
    fractions:
      all: 1.0
      half: 0.5
      quarter: 0.25
    repeats:
      all: 1
      half: 3
      quarter: 3

  # Early stopping needs a validation set, and a fold is a train/test division and nothing
  # else -- so stopping on the test set would leak (docs/TRAINING.md section 7a).
  # The slice is carved out of the TRAINING domains and logged with its own digest.
  validation:
    # 0 disables validation entirely and trains to a fixed step budget instead.
    fraction: 0.15
    # `regime` uses the regime's own grouping unit where one exists: whole connected
    # components for S2, random domains everywhere else. `random` and `component` force one.
    #
    # P1 and P3 have an inherent mismatch no setting fixes, and it is recorded rather than
    # papered over: P1's test task is transfer to an unseen family, and P3/all's training set
    # contains no variants at all by construction, so no slice of it can mimic the test task.
    # For those regimes validation measures "held-out proteins", not "held-out family" or
    # "held-out variants", and it is a stopping signal rather than a proxy for the score.
    grouping: regime

baseline:
  nn_lookup:
    # k = 1 is the primary form: the pure lookup table, and the thing to beat. The secondary
    # form averages the top `top_k` neighbours weighted by identity -- one extra line and a
    # slightly stronger bar (docs/ML_PLAN.md section 8.1).
    top_k: 5

# The C1 evaluation set: the held-out variants where copying the wild type FAILS.
#
# Decided 2026-08-19 (docs/DECISIONS.md). Under P3/all no variant is in training, so the
# nearest-neighbour baseline copies each variant's own wild type -- which is the hypothesis
# "the mutation has no effect". It scores mean AUPR 0.928 and MEDIAN 1.000, so for most
# variants that hypothesis is simply true and there is no headroom to measure anything in.
# Claim C1 lives in the variants where it is false, and this block defines them.
c1_set:
  # A variant enters the set when the wild-type copy scores below this, or when it scores
  # nothing at all because the variant lost binding entirely (a `dead_variant`, whose AUPR is
  # undefined rather than zero).
  #
  # 0.25, recalibrated 2026-08-27 from 0.7. The criterion is unchanged -- put the cut where the
  # distribution is sparse, so it isolates a tail instead of slicing through a dense region --
  # but the scale it applies to moved when the baseline stopped copying E-scores (D7). The
  # PREDICTION is identical either way: under P3/all the lookup says "this variant binds what
  # its wild type binds". Copying the continuous profile earned extra credit for ORDERING the
  # wild type's sites, which the binary copy does not, so the same prediction now scores
  # median 0.776 where it scored 1.000. At 0.7 the cut had drifted onto the median and was
  # selecting 83 of 173 variants -- half the set, which is not a tail.
  #
  # The lower distribution has a clear trough: 3 variants in 0.15-0.20, ONE in 0.20-0.25, then
  # 7 in 0.25-0.30. That single-variant bin is the cliff-free point 0.7 used to be.
  #
  #   below 0.25:  23 poorly_predicted + 18 dead = 41 of 173 (24%)
  #
  # Nothing became easier or harder: the 11 variants the old cut selected now score 0.000-0.330,
  # every one still in the tail, and the two orderings agree at rank correlation 0.614. The set
  # is larger than the old 29 because binary scoring reveals variants whose positive SET differs
  # from the wild type's, which the ordering credit used to partly rescue -- and those are
  # exactly the variants C1 is about.
  max_baseline_aupr: 0.25
  # `no_evidence` records are excluded here as everywhere: with no control there is no way to
  # tell a true non-binder from a failed assay, so their silence is not evidence of anything.
  keep_no_evidence: false

# The two-tower model. docs/TRAINING.md is the design document; every choice here has its
# reasoning there rather than in a comment.
model:
  # D, the shared space every tower projects into. Equal width across arms is what stops
  # "structure wins" from being "structure had more width" (docs/ML_PLAN.md section 4.2).
  width: 256

  dna:
    # The DNA axis has 32,896 points and every one is seen at every step, so this tower is in
    # a completely different data regime from the one it shares a space with, and is allowed
    # to be a real network. Channel count -- not batch size -- is what drives GPU memory:
    # the whole vocabulary passes through the convolution twice per step, once per strand.
    channels: 64
    layers: 2

  protein:
    # 0 = a bare linear projection, which is the default for a reason. The protein axis has
    # 1,338 points against a 1,280-d input, so a linear map to width 256 is already ~245
    # parameters per training protein. A hidden layer is a deliberate experiment.
    hidden: 0
    dropout: 0.0

  # Weight initialisation and batch order. SEPARATE FROM splits.seed, which decides which
  # domains are held out: those are unrelated choices with different blast radii, and sharing
  # one number meant a different fold assignment would silently also re-initialise the towers.
  # Split apart 2026-08-26. `scripts/run_grid.py --seeds N` runs each fold at this seed and the
  # N-1 that follow it, which is how a variance estimate is obtained; the default of 1 seed
  # keeps the grid at one run per (arm, fold).
  seed: 20260819

  # THE DECISION RULE (T38, resolved 2026-08-28 -- docs/DECISIONS.md section 13).
  #
  # lambda in `L = L_infonce + lambda * L_bce`. The InfoNCE term is a per-row softmax and is
  # therefore EXACTLY invariant to adding a constant to a whole protein's row, so it never says
  # where a row should sit -- only how it should be ordered. That is why the null anchor never
  # became a threshold and why a global Platt fit on the validation slice could not be one
  # either: no post-hoc step recovers an offset training never constrained. Binary cross-entropy
  # is not shift-invariant, and `sigmoid(model.calibrate(cosine))` is then a probability
  # comparable across proteins.
  #
  # 0.0 is the pure-ranking objective EXACTLY -- the calibration head takes no gradient at all --
  # which is what makes this one knob rather than a redesign. It does not reproduce an older run's
  # numbers: GPU training is not deterministic across processes (~0.003 AUPR on S1/fold-2), so a
  # lambda=0 control is re-run beside every sweep rather than read off reports/training.md.
  #
  # THE SCALE IS NOT 1. At initialisation the InfoNCE term is ~log(32896) = 10.4 while the BCE
  # term, predicting the base rate, is the entropy of a 0.0021 Bernoulli, ~0.0155. The terms
  # differ by ~670x, so the useful grid is logarithmic around 10^2-10^3 and `bce_weight: 1` is
  # very nearly `bce_weight: 0`. `scripts/run_lambda_sweep.py` enumerates it.
  #
  # It lives under `model:` rather than `training:` because `model:` is the block Trainer.save
  # stores inside every checkpoint, and whether the calibration head was trained is exactly the
  # thing a reader of a checkpoint must know before trusting `TwoTower.probabilities`.
  bce_weight: 0.0

  # CLIP convention: stored as log(1/temperature), clamped, and learned by default -- one
  # fewer thing to sweep across 19 folds x 4 arms, and the right scale depends on `width`.
  temperature: 0.07
  learn_temperature: true
  # The ceiling on the learned scale, 1/temperature. CLIP's convention and its value; it exists
  # because a runaway scale saturates the softmax early in training. MEASURED ON THIS DATA it is
  # reached by about step 4,000 and held, so from there the temperature is a fixed
  # hyperparameter rather than a learned one -- which is the clamp working, not failing, but is
  # reported with every run rather than left silent (docs/TRAINING.md section 9).
  max_logit_scale: 100.0

training:
  # An "epoch" is 21 steps at this batch size (1,338 domains / 64), so runs are specified in
  # steps. A step is well under a GFLOP; what limits the budget is wall-clock, not overfitting.
  #
  # 15,000, raised from 6,000 on 2026-08-26 after measuring the curve to 15,000 steps with early
  # stopping off. The old value rested on "the training loss keeps falling to ~0.01, so
  # everything past that is fitting the training proteins" -- and that turned out to be exactly
  # backwards. The loss does reach ~0.005, so the training proteins are memorised by about step
  # 6,000, but HELD-OUT test AUPR keeps improving for another 9,000 steps:
  #
  #   fold        mean test AUPR @5.5-6.5k   @13.5-15k    gain
  #   P3/all                        0.8563      0.8798   +0.024
  #   S2/fold-3                     0.2275      0.2457   +0.018
  #   S1/fold-2                     0.6584      0.6863   +0.028
  #
  # (Windows of three evals, compared WITHIN a single run, which is what makes the comparison
  # readable -- see below, cross-run variation is far from negligible.)
  #
  # CORRECTION, 2026-08-28: this comment used to add "two identical runs agree to 4e-6". That
  # holds within one process and NOT across invocations. Two processes, identical code, identical
  # seeds, gave losses 8.96644592285 and 8.96644687653 at step 50 and diverged from there -- CUDA
  # accumulates the Conv1d backward with atomics. End to end it moved the selected step from
  # 14,400 to 11,800 and the AUPR by 0.0026, and the sweep's three seeds put the within-cell
  # spread at 0.005 (max 0.012). The +0.018 to +0.028 gains above survive that floor comfortably;
  # several other deltas this project has reported do not (docs/DECISIONS.md section 13.5).
  #
  # Memorising the training set and generalising to unseen
  # proteins are simply not coupled here. Cosine LR decay was measured as an alternative and is
  # slightly WORSE at equal budget -- 0.8438 against 0.8458 on P3/all -- so the budget is the
  # lever, not the schedule. All three folds were still climbing at 15,000.
  steps: 15000
  # Shuffling is on the PROTEIN axis; the 8-mer axis stays complete, so the InfoNCE
  # denominator is exact rather than sampled (docs/TRAINING.md section 4).
  batch_domains: 64
  learning_rate: 0.001
  weight_decay: 0.01
  warmup_steps: 100
  # 100, so the validation curve is sampled finely enough to select a good checkpoint from a
  # noisy signal. 150 evaluations per run at 0.40 s each adds about 0.6 h across the 38-run
  # grid; 97% of that is the per-domain AUPR loop in numpy, not the forward pass (388 ms of
  # 402 ms), so it is the metric that costs, not the model.
  eval_every: 100
  # 0 -- every fold trains to the full budget. Early stopping fired on only 5 of 38 runs and all
  # five were S2, the regime the project hangs on: `A1 S2/fold-4` stopped at step 2,750 with its
  # best at 750, while `S2/fold-3` -- same regime, allowed to run -- was still gaining at 12,000.
  # Patience against a signal that swings 0.63->0.66 between adjacent evaluations was cutting
  # runs off rather than protecting them. The validation slice still selects a checkpoint; it no
  # longer terminates the run, and the model at the budget is scored beside the selected one so
  # the selection is measured (snp2prot.training.TrainingResult).
  patience: 0

metrics:
  # Secondary metrics, read as "of the k 8-mers we called, how many bind". Positives per
  # domain run 1 to 236 with a median of 49, so k spans that range.
  precision_at: [10, 50, 100]
  # Recall once the ranking is thresholded at this precision. Undefined for a domain whose
  # ranking never reaches it, and reported as such rather than as zero.
  recall_at_precision: 0.5

  # The calibration curve's bins, equal-mass rather than equal-width. At a 0.0021 base rate an
  # equal-width binning puts 99.9% of cells in the first bin and reports one number for the whole
  # negative cloud, which is the part being asked about
  # (snp2prot.evaluation.calibration.expected_calibration_error).
  calibration_bins: 15

  # The naive decision rule, reported beside the parameter-free one. `call_threshold` is a fixed
  # probability cut; `expected_count_rule` instead keeps the top round(sum p) 8-mers per protein,
  # which has no free parameter and cannot produce T38's failure mode -- one global cut calling
  # 56 8-mers for one protein and 408 for another with a comparable true count.
  call_threshold: 0.5

  # How many draws of the random-ranking null to sample per fold. A per-protein AUPR is anchored
  # to the protein's own positive rate, so a raw number is not comparable between folds and a
  # ratio near 1 is an eyeball rather than a test: 200 draws put a 95th percentile on the null so
  # a result can be called indistinguishable from random or not. About 1.2 s per fold -- the null
  # depends only on the held-out labels, so it is sampled directly rather than by shuffling a
  # prediction (snp2prot.evaluation.metrics.null_aupr). Seeded from splits.seed.
  null_repeats: 200
