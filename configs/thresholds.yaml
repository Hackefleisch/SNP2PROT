# Binarization thresholds. THE ONLY PLACE cutoffs are defined.
#
# No parser may hard-code a number that appears in this file — read it via
# `snp2prot.thresholds.load()`. Every emitted row records the cutoffs actually applied
# in its `threshold_pos` / `threshold_neg` columns, so a table is self-describing even
# if this file later changes.
#
# Reference: docs/TFDNA_MERGE_BRIEF.md §4.

version: 2

# =====================================================================================
#  DOMAIN BOUNDARIES  --  READ THIS BEFORE USING dbd_seq
# =====================================================================================
#
#  dbd_seq is NOT the raw Pfam domain. It is the Pfam envelope PADDED by `padding_aa`
#  residues on each side. This is deliberate and load-bearing.
#
#  WHY: Pfam's models start at the structural core. For homeodomains that is the
#  helix-turn-helix, which clips the N-terminal arm -- and the N-terminal arm reaches
#  into the DNA minor groove and makes real base contacts. Empirically, 3 of BAR15A's
#  91 point mutations fall 2-9 residues N-terminal of the Pfam start
#  (KLF11 R402Q, VSX1 G160D, SNAI2 D119E). Trimmed to the bare envelope, each of those
#  variants becomes sequence-identical to its own wild type while carrying a different
#  binding label -- invisible to any sequence or structure model.
#
#  So the stored subunit must satisfy three conditions:
#    1. it is solely responsible for the measured DNA interaction;
#    2. it is one continuous region, not fragments scattered through the protein;
#    3. every change that alters binding behaviour lies inside it.
#
#  Constructs that cannot satisfy these are dropped, not repaired. See
#  docs/DOMAIN_POLICY.md for the full rule and the audit of what it excludes.
# =====================================================================================

domain:
  # Padding applied to each side of the Pfam envelope. 10 covers every observed
  # out-of-envelope mutation (max 9) with margin, and is set from the biology of the
  # homeodomain N-terminal arm rather than fitted to those three cases.
  padding_aa: 10

  # Reject a construct whose Pfam hits span more than one family: two domains means two
  # spatial units and no way to attribute a signal to either (condition 1 and 2).
  allow_mixed_families: false

  # Reject a construct with repeated hits of one family -- a C2H2 zinc-finger array is
  # 2-6 separate ~23-residue folds on flexible linkers, each with its own Zn(2+), not one
  # continuous unit (condition 2). Set true to keep arrays as a single spanned region.
  allow_repeat_arrays: false

  # Reject a construct with no Pfam hit above the gathering threshold: we cannot say what
  # is doing the binding.
  allow_no_domain: false

  # The FULL Pfam-A library. An earlier version carried only nine hand-picked families,
  # so constructs from any other family were rejected as `no_domain` because the HMM was
  # missing rather than because nothing was there. UniPROBE spans 86 domain labels.
  hmm_db: data/external/pfam/Pfam-A.hmm

  # Pfam families that are DNA-binding domains. Only these take part in the admission
  # policy: a DBD sitting beside an unrelated domain is still solely responsible for the
  # DNA interaction, so non-DBD hits are recorded and otherwise ignored.
  # Generated by scripts/build_dbd_family_list.py.
  dbd_families: data/external/pfam/dbd_families.txt

pbm:
  score_type: pbm_escore
  # Universal PBM E-scores are on a fixed [-0.5, 0.5] scale.
  positive: 0.45          # E >= 0.45  -> label 1
  negative: 0.35          # E <= 0.35  -> label 0  (assayed_unbound)
  # Strictly between the two -> label -1, kept in the table but excluded from training.
  #
  # Applied PER EXPERIMENT, never on pooled values: HK and ME array designs shift
  # E-scores relative to one another, so a pooled cutoff silently reweights arrays.
  per_experiment: true

b1h:
  score_type: b1h_sscore
  # Recovery-based, using the two 3-AT stringencies as natural cutpoints.
  # NOTE: provisional — must be checked against the paper's own treatment before Phase 3
  # is considered done. Tracked as an open item in reports/OPEN_ITEMS.md.
  positive_stringency: 10mM_3AT   # recovered here -> label 1
  negative_stringency: 2mM_3AT    # NOT recovered even here -> label 0
  # recovered at 2 mM but not 10 mM -> label -1
  # Najafabadi s-score fallback, used only where recovery calls are unavailable:
  sscore_positive: null           # TODO Phase 3: set from the score distribution
  sscore_negative: null

snp_selex:
  score_type: snpselex_obs
  positive: null          # TODO Phase 4: set on OBS once the score distribution is seen
  negative: null
  # PBS is the allele-difference signal and is NOT used for the bound call; it is carried
  # alongside as a separate score for later analysis.
  trim_window: 19         # +/-9 around the variant position, from the 40 bp oligo
  keep_pbs: true

# Tier 4 is never binarized at parse time. Kd / dG stay continuous in the stored table and
# are thresholded only at evaluation, with the cutoff swept.
tier4:
  binarize_at_parse: false
  score_types: [dG_kcal, Kd_nM]
