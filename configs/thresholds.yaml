# Binarization thresholds. THE ONLY PLACE cutoffs are defined.
#
# No parser may hard-code a number that appears in this file — read it via
# `snp2prot.thresholds.load()`. Every emitted row records the cutoffs actually applied
# in its `threshold_pos` / `threshold_neg` columns, so a table is self-describing even
# if this file later changes.
#
# Reference: docs/TFDNA_MERGE_BRIEF.md §4.

version: 1

pbm:
  score_type: pbm_escore
  # Universal PBM E-scores are on a fixed [-0.5, 0.5] scale.
  positive: 0.45          # E >= 0.45  -> label 1
  negative: 0.35          # E <= 0.35  -> label 0  (assayed_unbound)
  # Strictly between the two -> label -1, kept in the table but excluded from training.
  #
  # Applied PER EXPERIMENT, never on pooled values: HK and ME array designs shift
  # E-scores relative to one another, so a pooled cutoff silently reweights arrays.
  per_experiment: true

b1h:
  score_type: b1h_sscore
  # Recovery-based, using the two 3-AT stringencies as natural cutpoints.
  # NOTE: provisional — must be checked against the paper's own treatment before Phase 3
  # is considered done. Tracked as an open item in reports/OPEN_ITEMS.md.
  positive_stringency: 10mM_3AT   # recovered here -> label 1
  negative_stringency: 2mM_3AT    # NOT recovered even here -> label 0
  # recovered at 2 mM but not 10 mM -> label -1
  # Najafabadi s-score fallback, used only where recovery calls are unavailable:
  sscore_positive: null           # TODO Phase 3: set from the score distribution
  sscore_negative: null

snp_selex:
  score_type: snpselex_obs
  positive: null          # TODO Phase 4: set on OBS once the score distribution is seen
  negative: null
  # PBS is the allele-difference signal and is NOT used for the bound call; it is carried
  # alongside as a separate score for later analysis.
  trim_window: 19         # +/-9 around the variant position, from the 40 bp oligo
  keep_pbs: true

# Tier 4 is never binarized at parse time. Kd / dG stay continuous in the stored table and
# are thresholded only at evaluation, with the cutoff swept.
tier4:
  binarize_at_parse: false
  score_types: [dG_kcal, Kd_nM]
