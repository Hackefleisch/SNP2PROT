[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snp2prot"
version = "0.0.1"
description = "Merged two-axis (TF DNA-binding domain x DNA site) binary binding dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",       # Parquet checkpoints; CSV only for tables under ~1e5 rows
    "pyyaml>=6",
    "requests>=2.31",
    "openpyxl>=3.1",     # Weirauch 2014 Table S6 ships the construct sequences as .xlsx
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
    "matplotlib",        # score-distribution plots in the binarization reports
]

# Modeling dependencies are deliberately unpinned until after Phase 6 (see CLAUDE.md).

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
