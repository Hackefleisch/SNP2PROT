[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snp2prot"
version = "0.0.1"
description = "TODO: one-line description of the SNP2PROT project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # TODO: pin as the project takes shape
    # "numpy",
    # "pandas",
    # "scikit-learn",
    # "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
